function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371; 
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function fetchOSRM(startLat, startLng, endLat, endLng) {
    try {
        const url = `https://router.project-osrm.org/route/v1/driving/${startLng},${startLat};${endLng},${endLat}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.routes && data.routes.length > 0) {
            return {
                distance: (data.routes[0].distance / 1000).toFixed(1),
                geometry: data.routes[0].geometry
            };
        }
    } catch (e) {
        console.error("Lỗi OSRM:", e);
    }
    return null;
}

            let codeOnly = parts[0].trim();
            let locality = rawCode.replace(codeOnly, '').replace(/^[\s,]+/, '').trim();

            if (olcInstance.isFull(codeOnly)) {
                let codeArea = olcInstance.decode(codeOnly);
                lat = codeArea.latitudeCenter;
                lng = codeArea.longitudeCenter;
            } else if (olcInstance.isShort(codeOnly)) {
                let refLat = 10.7769, refLng = 106.7009;
                if (locality) {
                    let locResult = await fetchNominatim(locality);
                    if (locResult) {
                        refLat = parseFloat(locResult.lat);
                        refLng = parseFloat(locResult.lon);
                    }
                }
                let fullCode = olcInstance.recoverNearest(codeOnly, refLat, refLng);
                let codeArea = olcInstance.decode(fullCode);
                lat = codeArea.latitudeCenter;
                lng = codeArea.longitudeCenter;
            } else {
                return alert("Mã Plus Code không hợp lệ!");
            }
        } catch (e) {
            return alert("Không thể giải mã Plus Code này!");
        }

        if (lat >= LIMIT.latMin && lat <= LIMIT.latMax && lng >= LIMIT.lngMin && lng <= LIMIT.lngMax) {
            document.getElementById("addr_lat").value = lat.toFixed(6);
            document.getElementById("addr_lng").value = lng.toFixed(6);
            map.setView([lat, lng], 17);
            await process(lat, lng);
            return;
        } else {
            return alert("Tọa độ giải mã nằm ngoài phạm vi phục vụ!");
        }
    }

    // 3. NHẬP TỌA ĐỘ TRỰC TIẾP
    if (latInput && lngInput) {
        let lat = parseFloat(latInput);
        let lng = parseFloat(lngInput);
        if (isNaN(lat) || isNaN(lng)) return alert("Tọa độ không hợp lệ!");
        if (lat >= LIMIT.latMin && lat <= LIMIT.latMax && lng >= LIMIT.lngMin && lng <= LIMIT.lngMax) {
            map.setView([lat, lng], 17);
            await process(lat, lng);
            return;
        } else {
            return alert("Tọa độ nằm ngoài giới hạn khu vực!");
        }
    }

    // 4. TÌM KIẾM THEO ĐỊA CHỈ VĂN BẢN
    if (!fullAddrInput) return alert("Vui lòng nhập tên địa điểm, địa chỉ, tọa độ hoặc Plus Code cần tìm!");

    let result = await fetchNominatim(fullAddrInput);
    if (!result && !fullAddrInput.toLowerCase().includes("hồ chí minh")) {
        result = await fetchNominatim(fullAddrInput + ", Hồ Chí Minh");
    }

    if (result) {
        const lat = parseFloat(result.lat);
        const lon = parseFloat(result.lon);
        document.getElementById("addr_lat").value = lat.toFixed(6);
        document.getElementById("addr_lng").value = lon.toFixed(6);
        map.setView([lat, lon], 17);
        await process(lat, lon);
    } else {
        alert("Không thể tìm thấy tọa độ của địa chỉ này. Vui lòng bổ sung rõ tên Phường/Xã, Quận/Huyện!");
    }
}

async function fetchNominatim(query) {
    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&viewbox=${BOX}&bounded=1`);
        const data = await res.json();
        const valid = data.filter(item => {
            const lat = parseFloat(item.lat), lon = parseFloat(item.lon);
            return (lat >= LIMIT.latMin && lat <= LIMIT.latMax && lon >= LIMIT.lngMin && lon <= LIMIT.lngMax);
        });
        return valid.length > 0 ? valid[0] : (data.length > 0 ? data[0] : null);
    } catch (e) { return null; }
}

async function process(lat, lng) {
    currentCoords = { lat: parseFloat(lat), lng: parseFloat(lng) };
    clearTempGraphics();

    tempMarker = L.marker([lat, lng]).addTo(map).bindPopup("<b>Vị trí ca cấp cứu mới</b>").openPopup();
    tempCircle1 = L.circle([lat, lng], { radius: 10000, color: '#c0392b', fillOpacity: 0.02, dashArray: '5,5', weight: 1 }).addTo(map);
    tempCircle2 = L.circle([lat, lng], { radius: 3000, color: '#2980b9', fillOpacity: 0.05, weight: 1 }).addTo(map);
    
    await renderStaticList();
}

async function renderStaticList() {
    if (!currentCoords) return;
    const { lat, lng } = currentCoords;
    const activeStations = stations.filter(s => !blacklist.includes(s.name));

    document.getElementById("list").innerHTML = `<b>⏳ ĐANG TÍNH TOÁN TUYẾN ĐƯỜNG TRẠM GẦN NHẤT...</b>`;

    const priorityGroup = activeStations
        .filter(s => priorityNames.includes(s.name))
        .map(s => ({ ...s, airDist: haversine(lat, lng, s.lat, s.lng) }))
        .sort((a, b) => a.airDist - b.airDist);

    const normalGroup = activeStations
        .filter(s => !priorityNames.includes(s.name))
        .map(s => ({ ...s, airDist: haversine(lat, lng, s.lat, s.lng) }))
        .sort((a, b) => a.airDist - b.airDist);

    const targetGroup = [...priorityGroup.slice(0, 5), ...normalGroup.slice(0, 6)];

    const roadPromises = targetGroup.map(async (s) => {
        const road = await fetchOSRM(s.lat, s.lng, lat, lng);
        return { ...s, roadDist: road ? parseFloat(road.distance) : 999 };
    });

    let filtered = await Promise.all(roadPromises);
    filtered.sort((a, b) => a.roadDist - b.roadDist);

    const titleText = `<b>📍 PA2: TRẠM GẦN NHẤT</b>`;
    renderCardList(titleText, filtered);
}

function renderCardList(titleText, filtered) {
    document.getElementById("list").innerHTML = titleText + filtered.map((s, i) => {
        const isPriority = priorityNames.includes(s.name);
        const cardStyle = isPriority ? `border-left: 4px solid #c0392b;` : `border-left: 4px solid #2980b9;`;
        const roadDistStr = s.roadDist ? `${s.roadDist} km` : "N/A";
        return `
            <div class="station-card" style="${cardStyle}" onclick="selectStation('${s.name}')">
                <b>${i + 1}. ${s.name}</b><br>
                <span>Khoảng cách đường bộ: <b>${roadDistStr}</b></span>
            </div>
        `;
    }).join("");
}

function selectStation(name) {
    alert("Đã chọn trạm: " + name);
}

function filterMapSearch(val) {
    const list = document.getElementById("mapSearchList");
    if (!val.trim()) { list.style.display = "none"; return; }
    const match = stations.filter(s => s.name.toLowerCase().includes(val.toLowerCase())).slice(0, 5);
    if (match.length === 0) { list.style.display = "none"; return; }
    list.innerHTML = match.map(m => `<div class="map-search-item" onclick="zoomToStation(${m.lat}, ${m.lng}, '${m.name}')">${m.name}</div>`).join("");
    list.style.display = "block";
}

function zoomToStation(lat, lng, name) {
    map.setView([lat, lng], 16);
    document.getElementById("mapSearchList").style.display = "none";
}

function handleRollSearch(val) {
    const list = document.getElementById("stRollList");
    if (!val.trim()) { list.style.display = "none"; return; }
    const match = stations.filter(s => s.name.toLowerCase().includes(val.toLowerCase())).slice(0, 5);
    if (match.length === 0) { list.style.display = "none"; return; }
    list.innerHTML = match.map(m => `<div class="roll-item" onclick="selectRollStation('${m.name}')">${m.name}</div>`).join("");
    list.style.display = "block";
}

function selectRollStation(name) {
    document.getElementById("stSearchInput").value = name;
    document.getElementById("stRollList").style.display = "none";
}
</script>
